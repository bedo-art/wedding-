<!-- RSVP Section Split into Groom & Bride Sections -->
<section id="rsvp" class="py-6">
    <div class="max-w-4xl mx-auto text-center mb-8">
        <span class="text-rose-600 uppercase tracking-widest text-xs sm:text-sm font-semibold">كن ضيفنا</span>
        <h2 class="text-2xl sm:text-4xl font-serif text-rose-900 mt-1">تأكيد الحضور والتهاني</h2>
        <p class="text-rose-600 text-xs sm:text-sm mt-1">يرجى اختيار القسم المخصص لتسجيل حضورك أو إرسال تهنئتك</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
        
        <!-- Groom's Section (Mahmoud) -->
        <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-xl border border-rose-100 card-3D text-right">
            <div class="text-center mb-6 border-b border-rose-100 pb-4">
                <span class="text-xs bg-rose-100 text-rose-700 px-3 py-1 rounded-full font-semibold">طرف العريس</span>
                <h3 class="text-xl sm:text-2xl font-serif text-rose-900 mt-2">تهاني وتأكيد حضور محمود</h3>
            </div>
            
            <form onsubmit="handleRSVP(event, '9918f5df-b5e9-4eee-82a6-36f0061bf600', 'groom-success')" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">الاسم الكامل</label>
                    <input type="text" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">رقم الواتساب / الهاتف</label>
                    <input type="text" name="whatsapp" required class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">رسالتك أو تهنئتك لعريسنا</label>
                    <textarea name="message" rows="2" placeholder="اكتب مباركة..." class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-medium py-2.5 rounded-xl transition shadow-md shadow-rose-600/20 text-sm">إرسال إلى قسم محمود</button>
            </form>
            <div id="groom-success" class="hidden text-center text-emerald-600 font-medium mt-4 text-xs">✅ تم إرسال رسالتك لمحمود بنجاح!</div>
        </div>

        <!-- Bride's Section (Menat Allah) -->
        <div class="bg-white/90 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-xl border border-rose-100 card-3D text-right">
            <div class="text-center mb-6 border-b border-rose-100 pb-4">
                <span class="text-xs bg-pink-100 text-pink-700 px-3 py-1 rounded-full font-semibold">طرف العروسة</span>
                <h3 class="text-xl sm:text-2xl font-serif text-rose-900 mt-2">تهاني وتأكيد حضور منة الله</h3>
            </div>
            
            <form onsubmit="handleRSVP(event, 'cb20dfda-4809-480f-87f4-3709f396c5b3', 'bride-success')" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">الاسم الكامل</label>
                    <input type="text" name="name" required class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">رقم الواتساب / الهاتف</label>
                    <input type="text" name="whatsapp" required class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-500 mb-1">رسالتك أو تهنئتك لعروستنا</label>
                    <textarea name="message" rows="2" placeholder="اكتب مباركة..." class="w-full px-4 py-2.5 rounded-xl border border-pink-100 focus:outline-none focus:ring-2 focus:ring-rose-300 bg-rose-50 text-sm"></textarea>
                </div>
                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-medium py-2.5 rounded-xl transition shadow-md shadow-pink-600/20 text-sm">إرسال إلى قسم منة الله</button>
            </form>
            <div id="bride-success" class="hidden text-center text-emerald-600 font-medium mt-4 text-xs">✅ تم إرسال رسالتك لمنة الله بنجاح!</div>
        </div>

    </div>
</section>
